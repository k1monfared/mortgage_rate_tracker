name: Deploy to GitHub Pages
on:
  push:
    branches: [master]
  schedule:
    # Hourly, so same-day sources (RBC prime, FRED DFEDTARU) and next-day
    # sources (BoC Valet) are picked up soon after they publish.
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest -q tests
      - name: Refresh rate data and build site
        run: python build_site.py
      - name: Send rate-change emails
        env:
          SUBSCRIBE_PROXY_URL: ${{ vars.SUBSCRIBE_PROXY_URL }}
          BROADCAST_AUTH_KEY: ${{ secrets.BROADCAST_AUTH_KEY }}
          SENDER_BASE_URL: https://k1monfared.github.io/mortgage_rate_tracker
        run: python send_rate_emails.py
      # Commit every data file together (rate CSVs, announcements, email state) so
      # the next run starts from exactly what this run saw. New observations
      # land most days, which also keeps the scheduled workflow from being
      # disabled for inactivity.
      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update rate data [skip ci]"
            git pull --rebase
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
