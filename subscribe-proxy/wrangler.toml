name = "mortgage-rates-subscribe-proxy"
main = "src/worker.ts"
compatibility_date = "2025-01-01"

# Non-secret config. Override per-deployment by editing this file. Secrets
# (RESEND_API_KEY, BROADCAST_AUTH_KEY) are set with `wrangler secret put`,
# never committed.
[vars]
SITE_NAME = "Mortgage Rate Tracker"
FROM_ADDR = "Mortgage Rate Tracker <mortgage_rate_tracker@k1monfared.com>"
ALLOWED_ORIGINS = "https://k1monfared.github.io"

# Redirect targets for the subscribe flow. Per-list (_CA/_US) overrides are
# used when a list is known; otherwise the base value applies.
CONFIRMATION_SENT_URL = "https://k1monfared.github.io/mortgage_rate_tracker/confirmation-sent/"
BLOCKED_URL           = "https://k1monfared.github.io/mortgage_rate_tracker/blocked/"
UNSUBSCRIBED_URL      = "https://k1monfared.github.io/mortgage_rate_tracker/unsubscribed/"
ERROR_URL             = "https://k1monfared.github.io/mortgage_rate_tracker/?err=1"

SUCCESS_URL_CA = "https://k1monfared.github.io/mortgage_rate_tracker/subscribed/?list=ca"
SUCCESS_URL_US = "https://k1monfared.github.io/mortgage_rate_tracker/subscribed/?list=us"
ERROR_URL_CA   = "https://k1monfared.github.io/mortgage_rate_tracker/ca/?err=1"
ERROR_URL_US   = "https://k1monfared.github.io/mortgage_rate_tracker/us/?err=1"

# Secrets to set via `wrangler secret put`:
#   RESEND_API_KEY        - reused from news_reader is fine; only the
#                           transactional /emails API is used here.
#   BROADCAST_AUTH_KEY    - any ≥32-char random string; GitHub Actions uses
#                           the same value to authenticate POST /broadcast.
#                           Generate with `openssl rand -hex 32`.
# Keeping these as secrets keeps the worker config portable and the audit
# log clean.

# KV namespace for pending confirmation tokens, rate-limit, and block keys.
# Create one with: npx wrangler kv namespace create SUBSCRIBE_KV
# Then replace the placeholder id below with the printed one.
[[kv_namespaces]]
binding = "SUBSCRIBE_KV"
id = "941a37701b71480c984836115eb4de17"

# D1 database: audit log + subscribers list + per-day sends ledger.
# Create one with: npx wrangler d1 create mortgage-subscribe-audit
# Apply schema:   npx wrangler d1 execute mortgage-subscribe-audit --remote --file=./schema.sql
# Then replace the placeholder database_id below with the printed one.
[[d1_databases]]
binding = "AUDIT_DB"
database_name = "mortgage-subscribe-audit"
database_id = "22d90559-917b-4583-9b6f-b7843e6721c9"
